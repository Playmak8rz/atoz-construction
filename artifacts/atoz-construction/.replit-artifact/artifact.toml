kind = "web"
previewPath = "/"
title = "A to Z Construction"
version = "1.0.0"
id = "artifacts/atoz-construction"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20720

[services.development]
run = "pnpm --filter @workspace/atoz-construction run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/atoz-construction", "run", "build" ]
publicDir = "artifacts/atoz-construction/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20720"
BASE_PATH = "/"
